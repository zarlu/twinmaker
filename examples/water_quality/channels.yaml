# Channel registry: the single source of truth for what can be measured.
#
#   unit            canonical unit; a reading with another unit is rejected
#   default_kind    measurement (node sensor) | label (trusted reference value, e.g. a lab
#                   result) | external (a series from outside the nodes, e.g. weather)
#   valid_min/max   outside this range a reading is stored but flagged `out_of_range`
#   max_step_15min  largest believable change per 15 minutes; a bigger jump is flagged `spike`
#                   (null = no spike check)
#   stuck_after     this many identical readings in a row are flagged `stuck` (null = no check)
#   saturation_min  optional: values at or above are flagged `saturated`
#
# The limits below are starting points for the example. Tune them on your own data.
schema_version: 1
channels:
  water_temp:
    label: Water temperature
    unit: degC
    default_kind: measurement
    valid_min: 0
    valid_max: 40
    max_step_15min: 3
    stuck_after: 12
    description: Water temperature.
  ph:
    label: pH
    unit: pH
    default_kind: measurement
    valid_min: 4
    valid_max: 11
    max_step_15min: 1.0
    stuck_after: 12
    description: pH.
  turbidity:
    label: Turbidity
    unit: NTU
    default_kind: measurement
    valid_min: 0
    valid_max: 1000
    max_step_15min: 200
    stuck_after: 12
    description: Turbidity.
  conductivity:
    label: Conductivity
    unit: uS/cm
    default_kind: measurement
    valid_min: 0
    valid_max: 5000
    max_step_15min: 500
    stuck_after: 12
    description: Specific conductance.
  dissolved_oxygen:
    label: Dissolved oxygen
    unit: mg/L
    default_kind: measurement
    valid_min: 0
    valid_max: 20
    max_step_15min: 3
    stuck_after: 12
    description: Dissolved oxygen.
  air_temp:
    label: Air temperature
    unit: degC
    default_kind: external
    valid_min: -30
    valid_max: 55
    max_step_15min: 10
    stuck_after: null
    description: Air temperature from a weather source.
